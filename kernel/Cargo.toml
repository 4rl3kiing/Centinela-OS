[package]
name = "centinela-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
centinela-hal = { path = "../hal" }
centinela-security = { path = "../security" }

[lints]
workspace = true

# The freestanding kernel binary defines its own panic handler and entry point,
# so it cannot be built as a host test harness; unit tests live in the library.
[[bin]]
name = "centinela-kernel"
path = "src/main.rs"
test = false
bench = false

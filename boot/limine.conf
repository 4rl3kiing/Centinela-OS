# Integrity hardening (see scripts/build-iso.sh):
# - the kernel path receives its BLAKE2b hash at ISO build time;
# - this file's BLAKE2b is enrolled into the BIOS and UEFI Limine executables;
# - the interactive editor is disabled so boot entries cannot be altered.
timeout: 3
default_entry: 1
verbose: yes
editor_enabled: no
hash_mismatch_panic: yes

/Centinela-OS (BIOS + UEFI)
protocol: limine
path: boot():/boot/centinela-kernel

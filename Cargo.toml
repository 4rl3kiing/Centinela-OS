[workspace]
members = ["kernel", "hal", "security", "userland"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/4rl3kiing/Centinela-OS"

[profile.dev]
panic = "abort"
overflow-checks = true

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 2
overflow-checks = true

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

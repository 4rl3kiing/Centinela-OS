name: Kani bounded formal proofs

on:
  push:
    branches: ["hardening/**"]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  kani:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Kani verifier
        run: cargo install --locked kani-verifier

      - name: Prepare Kani toolchain
        run: cargo kani setup

      - name: Verify security policy invariants
        run: cargo kani -p centinela-security --default-unwind 16

      - name: Verify PMM and VMM invariants
        run: cargo kani -p centinela-kernel --default-unwind 80

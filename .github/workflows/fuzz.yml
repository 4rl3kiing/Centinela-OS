name: Kernel fuzz smoke tests

on:
  push:
    branches: [main, "hardening/**", "microkernel/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pmm-fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install fuzzing toolchain dependencies
        run: sudo apt-get update && sudo apt-get install --yes clang

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked

      - name: Fuzz Limine memory map and PMM
        run: cargo +nightly fuzz run pmm_memory_map --target x86_64-unknown-linux-gnu -- -max_total_time=30 -max_len=512

      - name: Fuzz CFS mount, fsck and update on hostile images
        run: cargo +nightly fuzz run cfs_mount --target x86_64-unknown-linux-gnu -- -max_total_time=60 -max_len=65536

name: Kernel fuzz smoke tests

on:
  push:
    branches: ["hardening/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pmm-fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install fuzzing toolchain dependencies
        run: sudo apt-get update && sudo apt-get install --yes clang

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked

      - name: Fuzz Limine memory map and PMM
        run: cargo +nightly fuzz run pmm_memory_map --target x86_64-unknown-linux-gnu -- -max_total_time=30 -max_len=512

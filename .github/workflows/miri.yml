name: Miri memory and policy checks

on:
  push:
    branches: [main, "hardening/**", "microkernel/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miri-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  miri:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install nightly Rust and Miri
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly
          components: miri

      - name: Prepare Miri sysroot
        run: cargo +nightly miri setup

      - name: Run host-side tests under Miri
        run: cargo +nightly miri test --workspace --lib --target x86_64-unknown-linux-gnu

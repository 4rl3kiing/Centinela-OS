name: Kernel checks

on:
  push:
    branches: [main, "hardening/**", "microkernel/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install system build and emulation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential xorriso mtools qemu-system-x86 ovmf sbsigntool python3-virt-firmware

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.97.0"
          targets: x86_64-unknown-none
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --target x86_64-unknown-none -- -D warnings

      - name: Test memory manager
        run: cargo test --workspace --lib --target x86_64-unknown-linux-gnu

      - name: Build kernel
        run: cargo build --workspace --target x86_64-unknown-none --release

      - name: Generate ephemeral TEST Secure Boot keys
        run: bash scripts/secure-boot-keys.sh

      - name: Build hybrid BIOS and UEFI ISO (Secure Boot signed)
        env:
          SB_SIGNING_KEY: build/sb-keys/db.key
          SB_SIGNING_CERT: build/sb-keys/db.crt
        run: bash scripts/build-iso.sh

      - name: Boot test in BIOS, UEFI and UEFI Secure Boot
        env:
          SECURE_BOOT_TEST: "1"
        run: bash scripts/test-qemu.sh

      # Hardware virtualization: real CPU execution, timing and SMP
      # concurrency. Hosted runners expose /dev/kvm once the node is opened.
      - name: Enable KVM
        id: kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ -w /dev/kvm ]; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; fi

      - name: Boot test under KVM
        if: steps.kvm.outputs.available == 'true'
        env:
          KVM: "1"
          SECURE_BOOT_TEST: "1"
        run: bash scripts/test-qemu.sh

      - name: Report TCG vs KVM measurements
        if: always()
        run: |
          {
            echo "## Centinela-OS measurements"
            echo "KVM available: ${{ steps.kvm.outputs.available }}"
            echo '```'
            grep -h "bench:\|APIC timer calibrated\|SMP:" build/logs/qemu-bios.log build/logs/qemu-kvm-bios.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload boot diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: centinela-boot-diagnostics
          path: |
            build/logs/
            build/centinela-os.iso
          if-no-files-found: ignore

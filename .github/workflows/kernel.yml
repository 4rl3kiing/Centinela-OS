name: Kernel checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system build and emulation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential xorriso qemu-system-x86 ovmf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --target x86_64-unknown-none -- -D warnings

      - name: Test memory manager
        run: cargo test --workspace --lib --target x86_64-unknown-linux-gnu

      - name: Build kernel
        run: cargo build --workspace --target x86_64-unknown-none --release

      - name: Build hybrid BIOS and UEFI ISO
        run: bash scripts/build-iso.sh

      - name: Boot test in BIOS and UEFI
        run: bash scripts/test-qemu.sh

      - name: Upload boot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: centinela-boot-diagnostics
          path: build/
          if-no-files-found: ignore
